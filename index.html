<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Book a train ticket</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="stylesheet.css">
</head>
<body>
	<header>
		<nav class="navbar navbar-expand-lg navbar-light bg-light">
			<div class="container">
				<a class="navbar-brand" href="index.html">Home</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="mainNavigation">
					<ul class="navbar-nav ms-auto">
						<li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Home</a></li>
						<li class="nav-item"><a class="nav-link" href="task2.html">Task2</a></li>
						<li class="nav-item"><a class="nav-link" href="task3.html">Task3</a></li>
					</ul>
				</div>
			</div>
		</nav>
	</header>

	 <main class="container py-4 py-md-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
        
                <div class="ticket-card card border-0">
                    <h1 class="ticket-header card-header border-0 h4 mb-0">Book a train ticket</h1>
            
                    <form class="card-body ticket-body" action="#" method="get">
            
                        <!-- Trip type: two radio inputs styled as a segmented switch (btn-check + btn-group) -->
                        <div class="btn-group trip-toggle mb-4" role="group" aria-label="Trip type">
                            <input type="radio" class="btn-check" name="trip" id="oneway" value="oneway" checked>
                            <label class="btn" for="oneway">One way</label>
                            <input type="radio" class="btn-check" name="trip" id="round" value="round">
                            <label class="btn" for="round">Round trip</label>
                        </div>
            
                        <!-- From / To: floating labels -->
                        <div class="row g-3 mb-3">
                            <div class="col-12 col-md-6">
                                <div class="form-floating">
                                <input type="text" class="form-control" id="from" name="from" placeholder="From" autocomplete="off" required>
                                <label for="from">From</label>
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-floating">
                                <input type="text" class="form-control" id="to" name="to" placeholder="To" autocomplete="off" required>
                                <label for="to">To</label>
                                </div>
                            </div>
                        </div>
            
                        <!-- Departure / Return / Passengers: date inputs and select -->
                        <div class="row g-3 mb-3">
                            <div class="col-12 col-md-4">
                                <label for="departure" class="form-label">Departure</label>
                                <input type="date" class="form-control" id="departure" name="departure" required>
                            </div>
                            <div class="col-12 col-md-4">
                                <label for="return" class="form-label">Return</label>
                                <input type="date" class="form-control" id="return" name="return">
                            </div>
                            <div class="col-12 col-md-4">
                                <label for="passengers" class="form-label">Passengers</label>
                                <select class="form-select" id="passengers" name="passengers">
                                <option value="1" selected>1 adult</option>
                                <option value="2">2 adults</option>
                                <option value="3">3 adults</option>
                                <option value="4">4 adults</option>
                                <option value="5">5 adults</option>
                                <option value="6">6 adults</option>
                                </select>
                            </div>
                        </div>
            
                        <!-- Carriage class: inline radios inside a fieldset -->
                        <fieldset class="mb-3">
                        <legend class="form-label fs-6">Carriage class</legend>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="class" id="seat" value="seat" required>
                            <label class="form-check-label" for="seat">Seat</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="class" id="coupe" value="coupe">
                            <label class="form-check-label" for="coupe">Coupé</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="class" id="sleeper" value="sleeper">
                            <label class="form-check-label" for="sleeper">Sleeper</label>
                        </div>
                        </fieldset>
            
                        <!-- Phone (input group with +7 prefix) / Email -->
                        <div class="row g-3 mb-3">
                        <div class="col-12 col-md-6">
                            <label for="phone" class="form-label">Phone</label>
                            <div class="input-group">
                            <span class="input-group-text" id="phone-code">+7</span>
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78" autocomplete="tel" aria-describedby="phone-code" required>
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
                        </div>
                        </div>
            
                        <!-- Switch + checkbox -->
                        <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms" value="yes">
                        <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
                        </div>
                        <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="agree" name="agree" value="yes" required>
                        <label class="form-check-label" for="agree">I agree with the carriage rules</label>
                        </div>
            
                        <!-- HTML order: Clear, Find trains.
                            flex-column-reverse puts "Find trains" on top on a phone without changing the HTML order -->
                        <div class="d-flex  flex-column flex-sm-row justify-content-sm-end gap-2">
                        <button type="reset" class="btn btn-clear order-2  order-sm-1">Clear</button>
                        <button type="submit" class="btn btn-find order-1  order-sm-2">Find trains</button>
                        </div>
            
                    </form>
                </div>
        
            </div>
        </div>
    </main>

	<footer class="container py-4 text-center" id="contact">
		<p class="mb-0">&copy; 2026 </p>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
